[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hidro-mg-rag"
version = "0.1.0"
description = "Assistente RAG sobre legislação ambiental de águas (CONAMA, COPAM/CERH) com avaliação medida"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8.0"]
# PySpark remoto no Databricks a partir do VS Code (Databricks Connect).
# TODO(verificar): versão para o serverless do Free Edition (docs: Connect 18.0 a 18.3 = serverless v5, Python 3.12).
databricks = ["databricks-connect>=18.0,<19"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
